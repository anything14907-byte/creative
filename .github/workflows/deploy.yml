name: Deploy PyqRanker to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Install Dependencies
        working-directory: web-dashboard
        run: npm ci

      - name: Build Web Dashboard
        working-directory: web-dashboard
        run: npm run build

      - name: Prepare SPA routing for GitHub Pages
        run: |
          cp web-dashboard/dist/index.html web-dashboard/dist/404.html
          touch web-dashboard/dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-dashboard/dist
